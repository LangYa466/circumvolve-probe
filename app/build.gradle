plugins {
    id 'com.android.application'
}

android {
    namespace 'org.gfwreport.probe'
    compileSdk 35

    defaultConfig {
        applicationId 'org.gfwreport.probe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}
